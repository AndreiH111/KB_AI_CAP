# This is the resource bundle for com.takeda.kbaipocchatbot

# Texts for manifest.json

#XTIT: Application name
appTitle=KB AI Chatbot

#YDES: Application description
appDescription=An SAP Fiori application.

#XTIT: Main view title
title=KB AI Chatbot

#XBTN: Button text for creating a new chat
newChatButtonText=+ NEW CHAT

#XTIT: Chat history section title
chatHistoryTitle=CHAT HISTORY

#XTOL: Tooltip of the button that shows or hides the chat history panel
toggleChatHistoryTooltip=Show or hide chat history

#XTXT: Label for selected data source
dataSourceLabel=Data source:

#XLST: Data source choice that searches every file instead of pinning answers to one
allDataSources=All files

#XTXT: Label for selected AI model
aiModelLabel=AI Model:

#XBTN: Button text for editing chat settings
editButtonText=Edit

#XTXT: Empty state text for conversation list
conversationNoDataText=Start a conversation by sending a message.

#XTXT: Label for messages sent by the user
userMessageRoleLabel=User

#XTXT: Label for messages generated by the AI assistant
assistantMessageRoleLabel=AI Assistant

#XFLD: Placeholder text for chat input field
chatInputPlaceholder=Ask a question about your knowledge sources

#XMSG: Error shown when the chat history can't be loaded from the backend
chatHistoryLoadError=Couldn't load the chat history. Try again later.

#XMSG: Placeholder shown in the assistant message while waiting for the AI response
assistantThinking=Thinking…

#XMSG: Shown in the assistant message when the AI request fails
assistantError=Couldn't get an answer from the AI. Try again.

#XTIT: Heading above the sources an AI answer cites, one "[n] file (location)" line each
sourcesLabel=Sources

#XTXT: Tools the AI used for an answer; {0} is a comma-separated list of the tool names below
toolsUsedText=Used: {0}

#XTXT: Name of the AI tool that searches the uploaded documents
tool_search_knowledge_base=Document search

#XTXT: Name of the AI tool that calculates over spreadsheet rows
tool_query_spreadsheet=Spreadsheet analysis

#XTXT: Name of the AI tool that lists the uploaded files
tool_list_knowledge_base_sources=File list

#XTXT: Name shared by all the AI's Jira tools
tool_jira=Jira

#XTIT: Title of the dialog for editing the chat's data source and AI model
chatSettingsDialogTitle=Edit Chat Settings

#XBTN: Button text for saving the chat settings
saveButtonText=Save

#XBTN: Button text for closing the chat settings without saving
cancelButtonText=Cancel

#XMSG: Error shown when the data sources can't be loaded from the backend
dataSourcesLoadError=Couldn't load the data sources. Try again later.
