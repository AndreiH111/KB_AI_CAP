_schema-version: 3.3.0
ID: KB_AI_POC
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # CAP service
  - name: KB_AI_POC-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: KB_AI_POC-auth
      - name: KB_AI_POC-db
      - name: KB_AI_POC-connectivity
      - name: KB_AI_POC-destination
        group: destinations
        properties:
          forwardAuthToken: true
          timeout: 600000

  # HANA database deployer
  - name: KB_AI_POC-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: KB_AI_POC-db

  # Creates destinations used by the managed approuter
  - name: KB_AI_POC-destination-content
    type: com.sap.application.content
    deployed-after:
      - KB_AI_POC-auth
      - KB_AI_POC-html5-repo-host
    requires:
      - name: KB_AI_POC-destination
        parameters:
          content-target: true

      - name: KB_AI_POC-html5-repo-host
        parameters:
          service-key:
            name: KB_AI_POC-html5-repo-host-key

      - name: KB_AI_POC-auth
        parameters:
          service-key:
            name: KB_AI_POC-auth-key

    parameters:
      content:
        instance:
          destinations:
            - Name: KB_AI_POC_html5_repo_host
              ServiceInstanceName: KB_AI_POC-html5-service
              ServiceKeyName: KB_AI_POC-html5-repo-host-key
              sap.cloud.service: KB_AI_POC
              HTML5.DynamicDestination: true
              HTML5.Timeout: 60000
              WebIDEEnabled: true
              WebIDEUsage: html5_apps_repo_rt

            - Name: KB_AI_POC_uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: KB_AI_POC-xsuaa-service
              ServiceKeyName: KB_AI_POC-auth-key
              sap.cloud.service: KB_AI_POC

          existing_destinations_policy: update

    build-parameters:
      no-source: true

  # Deploys the generated UI5 ZIP files
  - name: KB_AI_POC-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: KB_AI_POC-html5-repo-host
        parameters:
          content-target: true

      - name: KB_AI_POC-auth
        parameters:
          service-key:
            name: KB_AI_POC-auth-key

    build-parameters:
      build-result: resources
      requires:
        - name: comtakedakbaipoc
          artifacts:
            - comtakedakbaipocdatasource.zip
          target-path: resources/

        - name: comtakedakbaipocchatbot
          artifacts:
            - comtakedakbaipocchatbot.zip
          target-path: resources/

  # Data Source UI5 application
  - name: comtakedakbaipoc
    type: html5
    path: app/kb_ai_poc_datasource
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # Chatbot UI5 application
  - name: comtakedakbaipocchatbot
    type: html5
    path: app/kb_ai_poc_chatbot
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  # HANA HDI container
  - name: KB_AI_POC-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # HTML5 application repository host
  - name: KB_AI_POC-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: KB_AI_POC-html5-service

  # XSUAA
  - name: KB_AI_POC-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: KB_AI_POC-xsuaa-service
      path: ./xs-security.json
      config:
        xsappname: KB_AI_POC-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

  # Connectivity service
  - name: KB_AI_POC-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  # Destination service
  - name: KB_AI_POC-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
        init_data:
          instance:
            destinations:
              - Name: ui5
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                URL: https://ui5.sap.com

              - Name: srv-api
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                URL: ~{srv-api/srv-url}
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                HTML5.Timeout: 600000

            existing_destinations_policy: update
    requires:
      - name: srv-api